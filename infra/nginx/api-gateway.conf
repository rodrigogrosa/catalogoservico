# api-gateway.conf  — nginx API Gateway with microservice routing
#
# Routing rules:
#   GET  /api/v1/projects           → svc-projects-read:8001  (list)
#   GET  /api/v1/projects/{id}      → svc-projects-read:8001  (detail; exactly 1 path segment)
#   *    everything else             → backend:8000
#
# The map directive selects the upstream based on HTTP method.
# All mutations (POST upload, POST process, DELETE, etc.) always go to the
# backend writer service regardless of path.

map $request_method $projects_upstream {
    default   "backend:8000";
    GET       "svc-projects-read:8001";
    HEAD      "svc-projects-read:8001";
    OPTIONS   "svc-projects-read:8001";
}

server {
    listen 443 ssl;
    server_name 127.0.0.1 localhost;

    ssl_certificate     /etc/nginx/certs/local-oauth.crt;
    ssl_certificate_key /etc/nginx/certs/local-oauth.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Project LIST ────────────────────────────────────────────────────────
    # Matches exactly /api/v1/projects (no trailing slash, no subpath).
    # GET → reader, mutations → backend.
    location = /api/v1/projects {
        proxy_pass          http://$projects_upstream;
        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    # ── Project DETAIL ───────────────────────────────────────────────────────
    # Matches /api/v1/projects/{id} where {id} contains no forward slash.
    # This excludes sub-routes like /process, /bundle, /versions, etc.
    # GET → reader, mutations → backend.
    location ~ "^/api/v1/projects/[^/]+$" {
        proxy_pass          http://$projects_upstream;
        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    # ── All other routes → backend writer ────────────────────────────────────
    location / {
        proxy_pass          http://backend:8000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Real-IP $remote_addr;
        # Upload / process can be slow; keep a generous timeout.
        proxy_read_timeout  120s;
        proxy_connect_timeout 5s;
        # Support large file uploads
        client_max_body_size 1100m;
    }
}
