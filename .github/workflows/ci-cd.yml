name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Backend — pytest
  # ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (trimesh/OpenGL)
        run: sudo apt-get install -y libgl1 libglib2.0-0 --no-install-recommends

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          SNAPMAKER_STORAGE_ROOT: /tmp/snapmaker3d-ci
          APP_ENV: testing
          OLLAMA_ENABLED: "false"
          FREE_AI_ENABLED: "false"

  # ──────────────────────────────────────────────────────────
  # 2. Frontend — lint + type-check
  # ──────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Next.js ESLint)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npx tsc --noEmit
        continue-on-error: true

  # ──────────────────────────────────────────────────────────
  # 3. Deploy — sincroniza catalogoservico → Northflank builda
  # Só roda em push direto na main (não em PRs)
  # Secret necessário: GH_DEPLOY_PAT (Fine-grained PAT com Contents:write em catalogoservico)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Sync → catalogoservico (Northflank)
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar identidade git
        run: |
          git config user.email "ci-deploy@github-actions"
          git config user.name "GitHub Actions CI"

      - name: Push para catalogoservico/snapmaker3d-studio
        run: |
          git remote add deploy \
            https://x-access-token:${{ secrets.GH_DEPLOY_PAT }}@github.com/rodrigogrosa/catalogoservico.git
          git push deploy HEAD:snapmaker3d-studio --force

      - name: Resumo do deploy
        if: always()
        run: |
          echo "### 🚀 Deploy disparado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mensagem | ${{ github.event.head_commit.message }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch destino | \`snapmaker3d-studio\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Repo deploy | [catalogoservico](https://github.com/rodrigogrosa/catalogoservico) |" >> $GITHUB_STEP_SUMMARY
          echo "| Projeto Northflank | \`snapmaker3d-studio\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Serviços | \`backend\`, \`frontend\` |" >> $GITHUB_STEP_SUMMARY
