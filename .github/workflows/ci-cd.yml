name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Permite disparar manualmente via GitHub UI ou API

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Backend — pytest (BLOCKER)
  # ──────────────────────────────────────────────────────────
  test-backend:
    name: "Backend: pytest"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (trimesh/OpenGL)
        run: sudo apt-get install -y libgl1 libglib2.0-0 --no-install-recommends

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          SNAPMAKER_STORAGE_ROOT: /tmp/snapmaker3d-ci
          APP_ENV: testing
          OLLAMA_ENABLED: "false"
          FREE_AI_ENABLED: "false"

  # ──────────────────────────────────────────────────────────
  # 2. Frontend — type-check (BLOCKER) + lint (WARNING)
  # ──────────────────────────────────────────────────────────
  test-frontend:
    name: "Frontend: tsc + lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (TypeScript) — BLOCKER
        run: npx tsc --noEmit

      - name: Lint (ESLint) — WARNING
        run: npm run lint
        continue-on-error: true  # ESLint warnings não bloqueiam deploy

  # ──────────────────────────────────────────────────────────
  # 3. Deploy — sincroniza catalogoservico → Northflank builda
  # Só roda em push direto na main (não em PRs)
  # Usa GITHUB_TOKEN ou DEPLOY_TOKEN para push HTTPS (sem SSH key obrigatória)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Sync → catalogoservico (Northflank)
    needs: [test-backend, test-frontend]
    if: |
      (github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar identidade git
        run: |
          git config user.email "ci-deploy@github-actions"
          git config user.name "GitHub Actions CI"

      - name: Push para catalogoservico/snapmaker3d-studio (HTTPS)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # Usa DEPLOY_TOKEN (PAT clássico com scope repo) se disponível,
          # caso contrário tenta DEPLOY_SSH_KEY via SSH (legado).
          if [ -n "$DEPLOY_TOKEN" ]; then
            git remote add deploy "https://x-access-token:${DEPLOY_TOKEN}@github.com/rodrigogrosa/catalogoservico.git"
          else
            # Fallback SSH (requer secret DEPLOY_SSH_KEY configurado)
            mkdir -p ~/.ssh
            echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            git remote add deploy git@github.com:rodrigogrosa/catalogoservico.git
          fi
          git push deploy HEAD:snapmaker3d-studio --force

      - name: Resumo do deploy
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "### 🚀 Deploy disparado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${COMMIT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mensagem | ${COMMIT_MSG} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch destino | \`snapmaker3d-studio\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Repo deploy | [catalogoservico](https://github.com/rodrigogrosa/catalogoservico) |" >> $GITHUB_STEP_SUMMARY
          echo "| Projeto Northflank | \`snapmaker3d-studio\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Serviços | \`backend\`, \`frontend\` |" >> $GITHUB_STEP_SUMMARY
