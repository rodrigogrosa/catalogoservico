services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: container
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      PUBLIC_BACKEND_ORIGIN: https://127.0.0.1:8443
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SNAPMAKER_STORAGE_ROOT: /data/SnapMaker3d
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b
      MASTER_USERNAME: ${MASTER_USERNAME:-admin}
      MASTER_PASSWORD: ${MASTER_PASSWORD:?MASTER_PASSWORD is required — set it in your .env file}
      MASTER_PASSWORD_ALIASES: ${MASTER_PASSWORD_ALIASES:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required — set it in your .env file}
      AUTH_TOKEN_TTL_HOURS: 12
    volumes:
      - ${HOME}/Downloads/Projetos3d/SnapMaker3d:/data/SnapMaker3d
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8010/api/v1
        NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:8010
    environment:
      SERVER_API_BASE_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8010/api/v1
      NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:8010
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  oauth_proxy:
    restart: unless-stopped
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./infra/nginx/oauth-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs/local-oauth.crt:/etc/nginx/certs/local-oauth.crt:ro
      - ./infra/certs/local-oauth.key:/etc/nginx/certs/local-oauth.key:ro
    ports:
      - "8443:443"
